<!--
  PARCIAL: head.html
  Cabeçalho técnico de todas as páginas (o que o navegador e o Google leem).
  Variáveis vêm do build.py: page.title, page.description, page.url, alternates...
  Segurança: a meta Content-Security-Policy abaixo só permite scripts, estilos,
  fontes e imagens do próprio site. Nada de terceiros. Detalhes em docs/SEGURANCA.md.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FDFBF8">

<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="author" content="{{ site.author }}">
<link rel="canonical" href="{{ page.url }}">

<!-- Versões do mesmo conteúdo em outros idiomas (ajuda o Google a mostrar o idioma certo) -->
{{#each alternates}}<link rel="alternate" hreflang="{{ .lang }}" href="{{ .url }}">
{{/each}}<link rel="alternate" hreflang="x-default" href="{{ page.default_url }}">

<!-- Pré-visualização ao compartilhar o link (WhatsApp, LinkedIn, Instagram) -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.og_title }}">
<meta property="og:description" content="{{ page.og_description }}">
<meta property="og:url" content="{{ page.url }}">
<meta property="og:image" content="{{ site.domain }}/assets/img/og-lilian-mesquita.jpg">
<meta property="og:locale" content="{{ page.og_locale }}">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/favicon.png">

<!-- Fontes da marca, hospedadas no próprio site: Playfair Display (títulos) e Poppins (texto) -->
<link rel="preload" href="/assets/fonts/playfair-display-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/assets/css/site.css?v={{ build.version }}">
