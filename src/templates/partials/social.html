<!--
  PARCIAL: social.html
  Atalhos para as redes da Lilian. Usado no rodapé e na seção "Quem conduz".
  - Instagram: ícone + @ ao lado.
  - LinkedIn: ícone + a palavra "LinkedIn" (o link longo do perfil não aparece escrito).
  Os endereços ficam em src/content/site.json (instagram_url, instagram_handle, linkedin_url).
-->
<ul class="social">
  <li>
    <a href="{{ site.instagram_url }}" target="_blank" rel="noopener noreferrer me" aria-label="{{ t.ui.instagram_label }}">
      <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".9" fill="currentColor" stroke="none"/></g></svg>
      <span>{{ site.instagram_handle }}</span>
    </a>
  </li>
  <li>
    <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener noreferrer me" aria-label="{{ t.ui.linkedin_label }}">
      <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 10.5V16.5M12 16.5V10.5M12 13.2c0-1.6 1-2.7 2.4-2.7S16.5 11.6 16.5 13v3.5"/><circle cx="8" cy="7.6" r=".9" fill="currentColor" stroke="none"/></g></svg>
      <span>LinkedIn</span>
    </a>
  </li>
</ul>
