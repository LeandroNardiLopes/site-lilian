<!--
  TEMPLATE: 404.html
  Página mostrada pelo GitHub Pages quando alguém abre um endereço que não existe.
  É gerada só no idioma principal (português), com links para os outros idiomas.
-->
<html lang="pt-BR">
<head>
<!--
  PARCIAL: head.html
  Cabeçalho técnico de todas as páginas (o que o navegador e o Google leem).
  Variáveis vêm do build.py: page.title, page.description, page.url, alternates...
  Segurança: a meta Content-Security-Policy abaixo só permite scripts, estilos,
  fontes e imagens do próprio site. Nada de terceiros. Detalhes em docs/SEGURANCA.md.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FDFBF8">

<title>Página não encontrada | Lilian Mesquita</title>
<meta name="description" content="O endereço que você abriu não existe ou mudou de lugar.">
<meta name="author" content="Lilian Mesquita">
<link rel="canonical" href="https://inglesindutivo.com.br/404.html">

<!-- Versões do mesmo conteúdo em outros idiomas (ajuda o Google a mostrar o idioma certo) -->
<link rel="alternate" hreflang="pt-BR" href="https://inglesindutivo.com.br/">
<link rel="alternate" hreflang="en" href="https://inglesindutivo.com.br/en/">
<link rel="alternate" hreflang="es" href="https://inglesindutivo.com.br/es/">

<meta property="og:title" content="Lilian Mesquita · Comunicação Inteligente">
<meta property="og:description" content="Eu não preparo você para a sala de aula. Preparo para a sala onde você vai estar.">

<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/favicon.png">
